<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsas Jeans - Coleção Exclusiva</title>
    <!-- Fonte bonita do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Círculos decorativos de fundo -->
    <div class="bg-shape circle-1"></div>
    <div class="bg-shape circle-2"></div>

    <main class="container">
        <!-- Cabeçalho / Título -->
        <header class="header">
            <span class="badge">Nova Coleção</span>
            <h1>BOLSAS JEANS</h1>
            <p class="subtitle">O toque moderno e elegante que o seu estilo merece.</p>
        </header>

        <!-- Card do Produto -->
        <div class="product-card">
            <span class="discount-tag">-20% OFF</span>

            <div class="image-wrapper">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-6WJ5W81hgxd67lHaM01_KjZ72G_pQ1JoUYiS3MDC-DSU51hHckHFD6i1&s=10" alt="Bolsa Jeans de Luxo">
            </div>

            <div class="product-info">
                <div class="rating">
                    ★★★★★ <span>(4.9/5)</span>
                </div>
                <h2>Bolsa Shoulder Denim Classic</h2>
                <div class="price-container">
                    <span class="price-old">R$ 189,90</span>
                    <span class="price-current">R$ 149,90</span>
                </div>
                <button class="buy-button">Garantir a Minha</button>
            </div>
        </div>

        <!-- Benefícios / Garantias -->
        <div class="features">
            <div class="feature-item">
                <span>🚚</span> Frete Grátis
            </div>
            <div class="feature-item">
                <span>🔒</span> Compra Segura
            </div>
            <div class="feature-item">
                <span>🔄</span> Troca Fácil
            </div>
        </div>
    </main>

</body>
</html>
